<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Minha Conta - Pastelaria Delivery</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="conta">
    <header class="site-header">
        <div class="site-header-inner">
            <a href="index.html" class="brand">
                <div class="brand-mark">パ</div>
                <div class="brand-text">Pastelaria<span>パステル屋 · Delivery</span></div>
            </a>
            <nav class="site-nav">
                <a href="index.html" data-nav="inicio">Início</a>
                <a href="cardapio.html" data-nav="cardapio">Cardápio</a>
            </nav>
            <div class="header-actions" id="headerActions"></div>
        </div>
    </header>

    <div class="page-title" id="contaPageTitle">
        <a href="index.html" class="page-back">Voltar ao início</a>
        <h1>Minha conta</h1>
    </div>

    <main class="container container-narrow" id="contaConteudo"></main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item" data-nav="inicio">
            <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
            Início
        </a>
        <a href="cardapio.html" class="nav-item" data-nav="cardapio">
            <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span>
            Cardápio
        </a>
        <a href="conta.html" class="nav-item nav-conta active">
            <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
            <span class="nav-label">Conta</span>
        </a>
    </nav>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script>
        if (!estaLogado()) {
            window.location.href = "login.html?redirect=conta.html";
        }

        const container = document.getElementById("contaConteudo");
        const pageTitle = document.getElementById("contaPageTitle");
        const usuario = getUsuario();

        function renderizarContaCliente(user) {
            pageTitle.innerHTML = `
                <a href="index.html" class="page-back">Voltar ao início</a>
                <h1>Minha conta</h1>
                <p>Seus pedidos e dados de entrega</p>`;

            container.innerHTML = `
                <div class="form-card conta-card conta-card--cliente">
                    <div class="conta-avatar">${(user.nome || "U")[0].toUpperCase()}</div>
                    <h2>${user.nome}</h2>
                    <p class="conta-email">${user.email_google || ""}</p>
                    ${user.telefone ? `<p class="conta-tel">${user.telefone}</p>` : ""}
                </div>
                <div class="page-actions conta-actions--cliente">
                    <a href="meus-pedidos.html" class="btn btn-primary">Meus pedidos</a>
                    <a href="cadastro.html" class="btn btn-secondary">Editar endereço</a>
                    <button class="btn btn-danger" onclick="logout()">Sair da conta</button>
                </div>`;
        }

        function renderizarContaAdmin(user) {
            document.body.classList.add("is-admin");
            pageTitle.innerHTML = `
                <a href="admin.html" class="page-back">Voltar ao painel</a>
                <h1>Área do funcionário</h1>
                <p>Gerencie pedidos ou teste o app como cliente</p>`;

            const inicial = (user.nome || "U")[0].toUpperCase();
            container.innerHTML = `
                <div class="conta-card conta-card--admin">
                    <div class="conta-admin-hero">
                        <div class="conta-admin-topo">
                            <div class="conta-avatar conta-avatar--admin">${inicial}</div>
                            <div class="conta-admin-identidade">
                                <span class="conta-admin-badge">Equipe · Modo funcionário</span>
                                <h2>${user.nome}</h2>
                                <p class="conta-email conta-email--admin">${user.email_google || ""}</p>
                            </div>
                        </div>
                        <p class="conta-admin-desc">Use o painel para operar pedidos. Abra o cardápio para simular a experiência do cliente.</p>
                    </div>
                    <div class="conta-admin-grid">
                        <a href="admin.html" class="conta-admin-tile conta-admin-tile--primary">
                            <span class="conta-admin-tile-icon">📋</span>
                            <strong>Pedidos de hoje</strong>
                            <small>Painel e gaveta</small>
                        </a>
                        <a href="cardapio.html" class="conta-admin-tile">
                            <span class="conta-admin-tile-icon">🥟</span>
                            <strong>Ver como cliente</strong>
                            <small>Testar cardápio</small>
                        </a>
                        <a href="meus-pedidos.html" class="conta-admin-tile">
                            <span class="conta-admin-tile-icon">🧾</span>
                            <strong>Meus pedidos</strong>
                            <small>Histórico pessoal</small>
                        </a>
                        <a href="cadastro.html" class="conta-admin-tile">
                            <span class="conta-admin-tile-icon">📍</span>
                            <strong>Endereço</strong>
                            <small>Dados de entrega</small>
                        </a>
                    </div>
                </div>
                <div class="page-actions conta-actions--admin">
                    <a href="admin.html" class="btn btn-admin">Abrir painel administrativo</a>
                    <button class="btn btn-danger btn-outline-admin" onclick="logout()">Sair da conta</button>
                </div>`;
        }

        function renderizarConta(user) {
            if (isAdmin()) renderizarContaAdmin(user);
            else renderizarContaCliente(user);
        }

        async function carregarConta() {
            try {
                const user = await api.getMe();
                if (user) {
                    setPersistedItem("usuario", JSON.stringify(user));
                    renderizarConta(user);
                    return;
                }
            } catch (_) {}

            if (usuario) renderizarConta(usuario);
        }

        carregarConta();
    </script>
</body>
</html>
