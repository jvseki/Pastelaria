<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento - Pastelaria Delivery</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="site-header-inner">
            <a href="index.html" class="brand">
                <div class="brand-mark">パ</div>
                <div class="brand-text">Pastelaria<span>パステル屋 · Delivery</span></div>
            </a>
            <nav class="site-nav">
                <a href="index.html">Cardápio</a>
                <a href="carrinho.html" class="active">Carrinho</a>
            </nav>
            <div class="header-actions" id="headerActions"></div>
        </div>
    </header>

    <div class="page-title">
        <a href="cadastro.html" class="page-back">Voltar ao endereço</a>
        <h1>Pagamento</h1>
        <p>Pagamento na hora da entrega</p>
    </div>

    <div class="checkout-steps">
        <span class="step done">Carrinho</span>
        <span class="step-line done"></span>
        <span class="step done">Endereço</span>
        <span class="step-line done"></span>
        <span class="step active">Pagamento</span>
    </div>

    <main class="container container-narrow">
        <div class="carrinho-total-box total-destaque">
            <p class="total-label">Total do pedido</p>
            <p class="total-valor" id="totalPedido">R$ 0,00</p>
        </div>

        <div class="form-card">
            <h3 class="section-title">Forma de pagamento</h3>

            <div class="pagamento-opcoes">
                <label class="pagamento-opcao" onclick="selecionarPagamento('presencial')">
                    <input type="radio" name="pagamento" value="presencial">
                    <div class="opcao-info">
                        <div class="opcao-titulo">Pix ou Dinheiro</div>
                        <div class="opcao-desc">Pague na entrega, ao receber o pedido</div>
                    </div>
                </label>

                <label class="pagamento-opcao" onclick="selecionarPagamento('cartao')">
                    <input type="radio" name="pagamento" value="cartao">
                    <div class="opcao-info">
                        <div class="opcao-titulo">Cartão na entrega</div>
                        <div class="opcao-desc">Débito ou crédito na hora da entrega</div>
                    </div>
                </label>
            </div>

            <div class="presencial-section" id="presencialSection">
                <p class="presencial-label">Como você vai pagar na entrega?</p>
                <div class="presencial-opcoes">
                    <label class="presencial-radio">
                        <input type="radio" name="formaPresencial" value="pix" onchange="selecionarFormaPresencial('pix')">
                        Pix na entrega
                    </label>
                    <label class="presencial-radio">
                        <input type="radio" name="formaPresencial" value="dinheiro" onchange="selecionarFormaPresencial('dinheiro')">
                        Dinheiro na entrega
                    </label>
                </div>

                <div class="pix-info-box" id="pixInfoBox">
                    <p class="pix-label">Chave Pix da pastelaria (pagamento na entrega)</p>
                    <div class="pix-chave-box">
                        <span id="pixChaveTexto"></span>
                        <button type="button" class="btn btn-secondary btn-sm" onclick="copiarPix()">Copiar</button>
                    </div>
                </div>

                <div class="troco-section" id="trocoSection">
                    <div class="form-group">
                        <label>Precisa de troco?</label>
                        <div class="troco-opcoes">
                            <label class="troco-radio"><input type="radio" name="precisaTroco" value="sim" onchange="toggleTroco()"> Sim</label>
                            <label class="troco-radio"><input type="radio" name="precisaTroco" value="nao" onchange="toggleTroco()" checked> Não</label>
                        </div>
                    </div>
                    <div class="form-group" id="trocoValorGroup" style="display:none">
                        <label for="trocoPara">Troco para quanto?</label>
                        <input type="number" id="trocoPara" min="0" step="0.01" placeholder="Ex: 50.00">
                    </div>
                </div>
            </div>
        </div>

        <div class="form-card confirmar-pagamento-box">
            <label class="confirmar-pagamento-label">
                <input type="checkbox" id="confirmarPagamento" onchange="atualizarBotaoFinalizar()">
                <span>
                    <strong>Confirmo o pagamento na entrega</strong>
                    <small>Estou ciente de que pagarei na hora da entrega conforme a forma selecionada acima.</small>
                </span>
            </label>
        </div>

        <button class="btn btn-primary btn-lg" id="btnFinalizar" onclick="finalizarPedido()" disabled>
            Confirmar pagamento e finalizar pedido
        </button>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
            Cardápio
        </a>
        <a href="carrinho.html" class="nav-item">
            <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></span>
            Carrinho
        </a>
        <a href="login.html" class="nav-item nav-conta">
            <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
            <span class="nav-label">Conta</span>
        </a>
    </nav>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/pagamento.js"></script>
</body>
</html>
