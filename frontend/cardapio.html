<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Cardápio - Pastéis Nakachi</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/nakachi.css">
    <link rel="stylesheet" href="css/motion.css">
    <script src="js/motion.js" defer></script>
</head>
<body data-page="cardapio">
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <header class="site-header">
        <div class="site-header-inner">
            <a href="index.html" class="brand">
                <div class="brand-text"><span>PASTÉIS</span>Nakachi</div>
            </a>
            <nav class="site-nav">
                <a href="index.html" data-nav="inicio">Início</a>
                <a href="cardapio.html" data-nav="cardapio">Cardápio</a>
            </nav>
            <div class="header-actions" id="headerActions"></div>
        </div>
    </header>

    <main id="conteudo">
        <section class="nk-container nk-menu-header"><span class="nk-eyebrow">Escolha, combine, aproveite</span><h1>O que vai ser hoje?</h1><p>Pastéis, bebidas e combinações para a sua fome.</p>
            <div class="nk-menu-scene nk-motion-scene" data-motion-scene aria-hidden="true">
                <div class="nk-scene-halo"></div>
                <div class="nk-scene-object nk-flavor-fan">
                    <img class="nk-flavor nk-flavor--left" src="images/produtos/pastel-carne.svg" alt="" width="220" height="165" decoding="async">
                    <img class="nk-flavor nk-flavor--right" src="images/produtos/caldo-cana.svg" alt="" width="220" height="165" decoding="async">
                    <img class="nk-flavor nk-flavor--center" src="images/produtos/pastel-queijo.svg" alt="" width="220" height="165" decoding="async">
                    <span class="nk-scene-spark nk-scene-spark--one">✦</span>
                    <span class="nk-scene-spark nk-scene-spark--two">✦</span>
                </div>
            </div>
            <label class="nk-search" for="buscaProduto">Encontre um sabor<input id="buscaProduto" type="search" placeholder="Busque por nome ou ingrediente" autocomplete="off"></label>
        </section>
        <nav class="categorias" id="categorias" aria-label="Categorias do cardápio"></nav>
        <p class="nk-container nk-results" id="resultadoBusca" role="status"></p>
        <section class="nk-product-grid" id="produtosGrid" aria-label="Produtos"><div class="nk-state" role="status">Carregando cardápio…</div></section>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item" data-nav="inicio">
            <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
            Início
        </a>
        <a href="cardapio.html" class="nav-item" data-nav="cardapio">
            <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span>
            Cardápio
        </a>
        <a href="login.html" class="nav-item nav-conta">
            <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
            <span class="nav-label">Conta</span>
        </a>
    </nav>

    <div class="modal-overlay modal-overlay--produto" id="modalItem">
        <div class="modal-box modal-produto-sheet" role="dialog" aria-modal="true" aria-labelledby="modalItemNome" tabindex="-1">
            <button type="button" class="modal-close-btn" onclick="fecharModalItem()" aria-label="Fechar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>

            <div class="modal-produto-hero">
                <img id="modalItemImg" class="modal-produto-hero-img" src="" alt="">
                <span class="modal-produto-kanji" id="modalItemKanji">商品</span>
            </div>

            <div class="modal-produto-scroll">
                <div class="modal-produto-head">
                    <span class="modal-produto-cat" id="modalItemCategoria"></span>
                    <h2 class="modal-produto-nome" id="modalItemNome"></h2>
                    <p class="modal-produto-desc" id="modalItemDescricao"></p>
                    <div class="modal-produto-preco-row">
                        <span class="modal-produto-preco" id="modalItemPreco"></span>
                        <span class="modal-carrinho-badge" id="modalItemQty"></span>
                    </div>
                </div>

                <div id="modalItemPreview">
                    <div id="modalComboArea" style="display:none"></div>
                    <div id="modalSimpleArea" class="modal-produto-qty">
                        <span class="modal-produto-qty-label">Quantidade</span>
                        <div class="modal-qty-stepper">
                            <button type="button" class="modal-qty-btn" onclick="alterarModalQuantidade(-1)" aria-label="Diminuir">−</button>
                            <span class="modal-qty-valor" id="modalItemQuantidade">1</span>
                            <button type="button" class="modal-qty-btn" onclick="alterarModalQuantidade(1)" aria-label="Aumentar">+</button>
                        </div>
                    </div>
                </div>

                <div id="modalItemPosAdd" class="modal-produto-sucesso" style="display:none">
                    <div class="modal-sucesso-icon" aria-hidden="true">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                    </div>
                    <h3 class="modal-sucesso-titulo" id="modalItemTituloSucesso">Adicionado!</h3>
                    <p class="modal-sucesso-texto" id="modalItemSucessoTexto"></p>
                    <button type="button" class="modal-sucesso-mais" onclick="adicionarMaisItem()">+ Adicionar mais um igual</button>
                </div>
            </div>

            <div class="modal-produto-footer" id="modalItemFooterPreview">
                <button type="button" class="btn btn-primary btn-modal-add" id="btnConfirmarItem" onclick="confirmarAdicionarItem()">
                    <span class="btn-modal-add-label" id="modalItemBtnLabel">Adicionar</span>
                    <span class="btn-modal-add-preco" id="modalItemTotalBtn">R$ 0,00</span>
                </button>
            </div>

            <div class="modal-produto-footer modal-produto-footer--dual" id="modalItemFooterPosAdd" style="display:none">
                <button type="button" class="btn btn-secondary" onclick="fecharModalItem()">Continuar comprando</button>
                <button type="button" class="btn btn-primary" onclick="finalizarPedidoDoModal()">Ver carrinho</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/produto-imagens.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/loja.js"></script>
    <script src="js/combo.js"></script>
    <script src="js/cardapio.js"></script>
</body>
</html>
