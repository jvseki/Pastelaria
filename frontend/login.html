<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Login - Pastelaria Delivery</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="no-bottom-nav">
    <header class="site-header">
        <div class="site-header-inner">
            <a href="index.html" class="brand">
                <div class="brand-mark">パ</div>
                <div class="brand-text">Pastelaria<span>パステル屋 · Delivery</span></div>
            </a>
            <div class="header-actions" id="headerActions"></div>
        </div>
    </header>

    <main class="login-container">
        <div class="login-logo">
            <div class="brand-mark login-brand-mark">パ</div>
            <h2>Pastelaria Delivery</h2>
            <p>Entre com sua conta Google para continuar</p>
        </div>

        <div id="loginLoading" class="loading">
            <div class="spinner"></div>
            Preparando login...
        </div>

        <div id="loginContent" class="form-card" style="display:none">
            <div id="googleLoginBtn" class="google-btn-wrap"></div>

            <div class="login-divider"><span>ou continue sem Google</span></div>

            <form id="loginLocalForm" class="login-local-form" onsubmit="handleLocalLogin(event)">
                <div id="loginLocalErro" class="form-erro" style="display:none"></div>
                <div class="form-group">
                    <label for="loginNome">Nome</label>
                    <input type="text" id="loginNome" required placeholder="Seu nome" autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="loginTelefone">Telefone (WhatsApp)</label>
                    <input type="tel" id="loginTelefone" required placeholder="(18) 99999-9999" autocomplete="tel">
                </div>
                <div class="form-group">
                    <label for="loginEmail">E-mail opcional</label>
                    <input type="email" id="loginEmail" placeholder="seu@email.com" autocomplete="email">
                </div>
                <button type="submit" class="btn btn-primary btn-lg" id="btnLoginLocal">Entrar e continuar</button>
            </form>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
