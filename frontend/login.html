<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Login - Pastéis Nakachi</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/nakachi.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="no-bottom-nav">
    <header class="site-header">
        <div class="site-header-inner">
            <a href="index.html" class="brand">
                <div class="brand-text"><span>PASTÉIS</span>Nakachi</div>
            </a>
            <div class="header-actions" id="headerActions"></div>
        </div>
    </header>

    <main class="login-container">
        <div class="login-logo">
            <div class="brand-mark login-brand-mark">パ</div>
            <h2>Pastéis Nakachi</h2>
            <p>Entre com sua conta Google para continuar</p>
        </div>

        <div id="loginLoading" class="loading">
            <div class="spinner"></div>
            Preparando login...
        </div>

        <div id="loginContent" class="form-card login-card" style="display:none">
            <div id="ultimaContaCard" class="ultima-conta-card" style="display:none">
                <p class="ultima-conta-label">Bem-vindo de volta</p>
                <div class="ultima-conta-perfil">
                    <div class="ultima-conta-avatar" id="ultimaContaAvatar">U</div>
                    <div class="ultima-conta-info">
                        <strong id="ultimaContaNome">Usuário</strong>
                        <span id="ultimaContaEmail">email@gmail.com</span>
                    </div>
                </div>
                <button type="button" class="btn btn-primary btn-lg btn-block" id="btnContinuarUltimaConta"
                    onclick="entrarComUltimaConta()">
                    Continuar com esta conta
                </button>
                <p class="ultima-conta-hint">Ou use outra conta Google abaixo.</p>
            </div>
            <div id="googleLoginBtn" class="google-btn-wrap"></div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
