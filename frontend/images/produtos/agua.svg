<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity=".3"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0369a1" flood-opacity=".2"/>
    </filter>
  </defs>
  <rect width="400" height="320" fill="url(#bg)" rx="16"/>
  <g stroke="#b8860b" stroke-width="1.5" opacity=".35" fill="none" stroke-linecap="round">
    <path d="M20 34 V20 H34"/>
    <path d="M380 286 V300 H366"/>
  </g>
  <circle cx="200" cy="170" r="120" fill="url(#spotlight)"/>
  <ellipse cx="200" cy="275" rx="48" ry="10" fill="#0369a1" opacity=".12"/>
  <g filter="url(#shadow)">
    <rect x="188" y="72" width="24" height="18" rx="4" fill="#0ea5e9" stroke="#0369a1" stroke-width="2"/>
    <path d="M168 90 Q168 78 200 78 Q232 78 232 90 L228 248 Q200 262 172 248 Z" fill="url(#bottle)" stroke="#0369a1" stroke-width="2.5"/>
    <path d="M178 120 Q200 108 222 120 L220 230 Q200 242 180 230 Z" fill="url(#water)"/>
    <rect x="174" y="95" width="14" height="140" rx="6" fill="#fff" opacity=".25"/>
    <ellipse cx="200" cy="140" rx="12" ry="22" fill="#fff" opacity=".2"/>
    <path d="M185 200 Q200 188 215 200" fill="none" stroke="#fff" stroke-width="2" opacity=".35"/>
  </g>
  <text x="200" y="42" text-anchor="middle" font-family="Georgia,serif" font-size="19" font-weight="700" fill="#0369a1">Agua Mineral</text>
  <rect x="172" y="47" width="56" height="19" rx="9.5" fill="#fff" opacity=".55" stroke="#0284c7" stroke-width="1" stroke-opacity=".3"/>
  <text x="200" y="60" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#64748b" letter-spacing="2">500ml</text>
