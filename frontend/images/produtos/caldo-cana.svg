<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="cane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#84cc16" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#84cc16" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#365314" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="400" height="320" fill="url(#bg)" rx="16"/>
  <g stroke="#b8860b" stroke-width="1.5" opacity=".35" fill="none" stroke-linecap="round">
    <path d="M20 34 V20 H34"/>
    <path d="M380 286 V300 H366"/>
  </g>
  <circle cx="200" cy="170" r="120" fill="url(#spotlight)"/>
  <ellipse cx="200" cy="272" rx="50" ry="10" fill="#365314" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="168" y="88" width="64" height="14" rx="4" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>
    <path d="M162 102 L162 238 Q200 252 238 238 L238 102 Z" fill="url(#cup)" stroke="#a16207" stroke-width="2.5"/>
    <path d="M172 130 L172 228 Q200 240 228 228 L228 130 Z" fill="url(#liquid)" opacity=".9"/>
    <rect x="108" y="148" width="140" height="10" rx="3" fill="url(#cane)" transform="rotate(-12 178 153)"/>
    <rect x="118" y="168" width="120" height="8" rx="3" fill="#65a30d" transform="rotate(8 178 172)"/>
    <rect x="128" y="186" width="100" height="7" rx="3" fill="#84cc16" transform="rotate(-5 178 189)"/>
    <ellipse cx="200" cy="145" rx="24" ry="6" fill="#fff" opacity=".3"/>
  </g>
  <text x="200" y="42" text-anchor="middle" font-family="Georgia,serif" font-size="19" font-weight="700" fill="#365314">Caldo de Cana</text>
  <rect x="160" y="47" width="80" height="19" rx="9.5" fill="#fff" opacity=".55" stroke="#65a30d" stroke-width="1" stroke-opacity=".3"/>
  <text x="200" y="60" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#64748b" letter-spacing="2">フレッシュ</text>
