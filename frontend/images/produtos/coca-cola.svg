<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="can" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="45%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="canTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#7f1d1d" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="400" height="320" fill="url(#bg)" rx="16"/>
  <ellipse cx="200" cy="275" rx="52" ry="10" fill="#000" opacity=".12"/>
  <g filter="url(#shadow)">
    <ellipse cx="200" cy="88" rx="52" ry="12" fill="url(#canTop)" stroke="#991b1b" stroke-width="2"/>
    <rect x="148" y="88" width="104" height="168" rx="12" fill="url(#can)" stroke="#7f1d1d" stroke-width="2.5"/>
    <rect x="158" y="98" width="84" height="62" rx="6" fill="#fff"/>
    <text x="200" y="128" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="16" font-weight="900" fill="#dc2626">COCA</text>
    <text x="200" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#dc2626">COLA</text>
    <rect x="152" y="92" width="22" height="160" rx="8" fill="url(#shine)"/>
    <ellipse cx="200" cy="256" rx="52" ry="8" fill="#7f1d1d" opacity=".25"/>
  </g>
  <text x="200" y="42" text-anchor="middle" font-family="Georgia,serif" font-size="19" font-weight="700" fill="#9f1239">Coca-Cola Lata</text>
  <text x="200" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#a8a29e" letter-spacing="2">350ml</text>
</svg>
