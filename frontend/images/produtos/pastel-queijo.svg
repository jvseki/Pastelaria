<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#fde8e8"/>
    </linearGradient>
    <linearGradient id="crust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cheese" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7c2d12" flood-opacity="0.18"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="320" fill="url(#bg)" rx="16"/>
  <ellipse cx="200" cy="268" rx="95" ry="14" fill="#92400e" opacity=".12"/>
  <g filter="url(#shadow)">
    <path d="M72 210 Q200 72 328 210 L308 252 Q200 168 92 252 Z" fill="url(#crust)" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/>
    <path d="M92 218 Q200 118 308 218" fill="none" stroke="#fff" stroke-width="5" opacity=".35" stroke-linecap="round"/>
    <ellipse cx="200" cy="198" rx="62" ry="30" fill="url(#cheese)" stroke="#ca8a04" stroke-width="2.5"/>
    <path d="M148 198 Q200 232 252 198" fill="#fde047" opacity=".85"/>
    <ellipse cx="200" cy="192" rx="38" ry="14" fill="#fff" opacity=".45"/>
    <path d="M170 205 Q200 218 230 205" fill="none" stroke="#eab308" stroke-width="2" opacity=".6"/>
  </g>
  <circle cx="318" cy="58" r="3" fill="#c41e3a" opacity=".5"/>
  <circle cx="332" cy="72" r="2" fill="#c41e3a" opacity=".35"/>
  <circle cx="82" cy="64" r="2.5" fill="#c41e3a" opacity=".4"/>
  <text x="200" y="42" text-anchor="middle" font-family="Georgia,serif" font-size="19" font-weight="700" fill="#9f1239" letter-spacing=".5">Pastel de Queijo</text>
  <text x="200" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#a8a29e" letter-spacing="2">チーズ</text>
</svg>
