services:
  - type: web
    name: pastelaria-delivery-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: MOTOBOY_WHATSAPP
        sync: false
      - key: PIX_CHAVE
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
